name: "Claude Code with credential fallback"
description: >-
  Run anthropics/claude-code-action with an ordered credential ladder. For a
  caller that wires anthropic_api_key, that metered rung goes FIRST — the
  caller is choosing to pay for a reliable run on every attempt, not just as a
  last resort — with a primary OAuth token and up to six OAuth fallbacks below
  it as the free backstop if the key itself fails. One input per OAuth
  credential in the ladder SSOT, .github/scripts/lib/claude-oauth-ladder.bash;
  anthropic_api_key sits outside that SSOT by design. Leaving it unset (the
  default) keeps a caller on the OAuth-only seven-rung ladder every other
  caller has — this is the one deliberate exception to this repo's default of
  never billing a metered key in CI. A rung is attempted when NO earlier rung
  has produced a non-errored run and that rung's own token is non-empty, so an
  unset middle tier is stepped over instead of ending the ladder (claude-code-action
  exits 0 even on a failure, so the execution log is the only signal). Each retry
  waits out a short escalating backoff first, so one provider-side blip cannot
  consume every credential at once. Between the primary rung and the second tier
  sits one extra attempt, after its own wait, on the PRIMARY credential — taken
  only when the primary's failure billed nothing (zero_cost) and so costs nothing
  to repeat, and the only retry a caller that configures no fallback tokens at all
  can get. This is the SINGLE place the
  retry-on-credential-failure ladder lives; callers pass the tokens + the per-use
  action config and read one execution_file / errored back, instead of hand-rolling
  the primary/fallback steps in every job. To add a tier, add one input plus one
  backoff/attempt/check/state group here, chaining its state step off the last one,
  AND pass the new input at every call site — a composite input a caller misspells
  is dropped with only a warning, which is how the whole fallback ladder once
  collapsed to a single rung; workflow-step-refs.test.mjs now fails on that typo.
  The free same-credential retry is deliberately not repeated
  per tier, since a blip that survives it is not transient. Detection is delegated
  to the shared claude-run-errored.sh (workspace-relative), so this action REQUIRES
  the caller to have checked out a TRUSTED tree (base ref) — never run it off an
  untrusted PR head.
inputs:
  oauth_token:
    description: "Primary Claude subscription OAuth token."
    required: true
  # One input per rung of the ladder SSOT
  # (.github/scripts/lib/claude-oauth-ladder.bash), each named after the SECRET
  # it carries rather than its position — the suffixes are the secret's, so
  # `oauth_token_fallback` is CLAUDE_CODE_OAUTH_TOKEN_FALLBACK and
  # `oauth_token_fallback_2` is ..._FALLBACK_2 even though that is the third
  # credential tried. `_2` was missing here entirely: the bash resolver honoured
  # that credential and this action stepped straight over it.
  oauth_token_fallback:
    description: "CLAUDE_CODE_OAUTH_TOKEN_FALLBACK; empty skips its attempt."
    required: false
    default: ""
  oauth_token_fallback_2:
    description: "CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2; empty skips its attempt."
    required: false
    default: ""
  oauth_token_fallback_3:
    description: "CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3; empty skips its attempt."
    required: false
    default: ""
  oauth_token_fallback_4:
    description: "CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4; empty skips its attempt."
    required: false
    default: ""
  oauth_token_fallback_5:
    description: "CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5; empty skips its attempt."
    required: false
    default: ""
  oauth_token_fallback_6:
    description: "CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6; empty skips its attempt."
    required: false
    default: ""
  anthropic_api_key:
    description: >-
      Metered Anthropic API key, tried FIRST — before the primary OAuth token
      and its six fallbacks, which become the free backstop if this rung
      itself fails. Outside the OAuth ladder SSOT by design — this is the one
      rung that bills, on every attempt it makes. Empty (the default) skips
      it, so a caller must opt in explicitly; most callers should leave this
      unset.
    required: false
    default: ""
  github_token:
    description: >-
      The workflow GITHUB_TOKEN, handed to the action directly so it skips the
      OIDC->GitHub-App token exchange that isn't authorized here.
    required: true
  gh_token:
    description: >-
      Exported as GH_TOKEN into every attempt, for the `gh` calls the agent's own
      Bash tool makes (a caller whose agent pushes a branch needs a PAT here, so
      the push retriggers checks). Set as an input rather than left to the calling
      step's `env:`, which a composite action's steps do not reliably inherit.
      Empty falls back to github_token, so GH_TOKEN is never exported empty.
    required: false
    default: ""
  model:
    description: >-
      Model slug (e.g. claude-opus-5). Rendered into the action's --model flag
      here, ahead of claude_args, so every attempt pins the tier explicitly and the
      action never rides its Opus default; keep the slug OUT of claude_args.
    required: true
  claude_args:
    description: "The --effort/--allowedTools/--add-dir/... arg string (NO --model — pass that as `model`)."
    required: true
  prompt:
    description: "The prompt handed to claude-code-action."
    required: true
  allowed_non_write_users:
    description: 'Passed through to claude-code-action (e.g. "*" to review fork PRs); empty = default.'
    required: false
    default: ""
  allowed_bots:
    description: 'Passed through to claude-code-action (e.g. "claude"); empty = default.'
    required: false
    default: ""
  untrusted_files:
    description: >-
      Newline-separated entries naming the files that hold untrusted input for
      this run (each entry is rendered as a bullet, so "label: /path (note)" is
      fine). When non-empty, the canonical untrusted-data guard in
      untrusted-data-preamble.md (beside this manifest) is prepended to the prompt.
      Declare WHICH files are untrusted; never restate the rule in your prompt.
    required: false
    default: ""
  gate_execution:
    description: >-
      Fail the run when its execution log reports is_error (or is missing,
      corrupt, or carries no result event). Defaults to "true": a green
      claude-code-action step is not proof Claude ran, so the gate belongs on by
      default. Set "false" only with a stated reason at the call site.
    required: false
    default: "true"
  gate_context:
    description: >-
      Label the gate puts in its error messages ("<context> ended in error ...").
      Empty falls back to the script's own "Claude run".
    required: false
    default: ""
outputs:
  execution_file:
    description: "Execution-log path of the LAST attempt that ran (newest first)."
    value: ${{ steps.resolve_log.outputs.execution_file }}
  errored:
    description: >-
      'true'/'false' from the LAST attempt that ran. A skipped attempt's check
      emits nothing, so the newest-first `||` resolves to the final attempt's
      verdict. c0 (the metered rung, first when wired) sits LAST in the chain
      for that reason — it is the earliest-run rung, not the latest. At least
      one rung's check always runs (c0 when anthropic_api_key is set,
      otherwise c1), so this is never empty and a ladder that never reached a
      working credential reports 'true'. The final step below fails the
      composite loud on 'true'.

      An attempt that writes NO execution log is 'true' as well, and the ladder
      then walks every remaining credential. Some of those failures are
      credential-independent — the action's actor gate (allowed_bots /
      allowed_non_write_users) throws before it ever validates the Anthropic
      token, so a bot-authored PR burns all eight rungs when anthropic_api_key
      is wired (seven otherwise) — plus the free same-credential retry, since a
      run that writes no log billed nothing and so reads as zero_cost — on one
      unchangeable verdict. The ladder cannot tell that case from a genuinely
      empty token, which fails the same way: claude-code-action exports no
      reason/conclusion output, so the only signal separating them lives in the
      job log. Reading it would mean log scraping, and re-deriving the actor
      verdict here would fork the gate; both are worse than eight (or nine)
      wasted attempts.
    value: ${{ steps.c6.outputs.errored || steps.c5.outputs.errored || steps.c4.outputs.errored || steps.c3.outputs.errored || steps.c2b.outputs.errored || steps.c2.outputs.errored || steps.c1r.outputs.errored || steps.c1.outputs.errored || steps.c0.outputs.errored }}
runs:
  using: "composite"
  steps:
    # An empty `model` renders `--model` with no value, and claude-code-action
    # then runs on ITS default (Opus, ~5x Sonnet). Refusing here is the choke
    # point: every caller reaches the action through every rung of the ladder,
    # so no present or future one can spend an unpinned model.
    - name: Refuse an unpinned model
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        # Stripped, not just unset: `--model` followed by whitespace renders the
        # same flag-with-no-value as the empty string does.
        [[ -n "${MODEL//[[:space:]]/}" ]] || {
          echo "::error::model input is empty — claude-code-action would run on its own default." >&2
          exit 1
        }

    # `untrusted_files` was a declared input that NOTHING read: every rung passed
    # `inputs.prompt` straight through, so a caller that declared its untrusted
    # inputs got the guard silently dropped. Composing here — once, ahead of the
    # ladder — is what makes the input mean what it says, and keeps every rung on
    # the identical prompt.
    - name: Compose the prompt (prepend the untrusted-data guard when declared)
      id: compose_prompt
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        UNTRUSTED_FILES: ${{ inputs.untrusted_files }}
      # Both paths come off $GITHUB_ACTION_PATH rather than the workspace: this
      # action is documented as safe to run with an UNTRUSTED tree checked out,
      # so the guard text and the composer must come from the action's own
      # (base-ref) copy and never from whatever the PR head put at that path.
      run: |
        PREAMBLE="${GITHUB_ACTION_PATH}/untrusted-data-preamble.md" \
          bash "${GITHUB_ACTION_PATH}/compose-claude-prompt.sh"

    # The metered rung goes FIRST: a caller that wires anthropic_api_key wants
    # its reviews to land reliably and is choosing to pay for that on every
    # run, not just as a last resort. Unset (the default) skips straight to
    # the primary OAuth credential below, unconditionally, exactly as before.
    - name: Attempt with the metered API key
      id: a0
      if: inputs.anthropic_api_key != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the metered API-key attempt run?
      id: c0
      if: inputs.anthropic_api_key != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a0.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    - name: Ladder state after the metered API-key attempt
      id: s0
      shell: bash
      env:
        PRIOR: "true"
        ERRORED: ${{ steps.c0.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    - name: Back off before the primary-credential attempt
      if: steps.s0.outputs.still_needs_attempt == 'true' && inputs.anthropic_api_key != ''
      shell: bash
      env:
        BACKOFF_SECONDS: "10"
      run: sleep "$BACKOFF_SECONDS"

    - name: Attempt with the primary credential
      id: a1
      if: steps.s0.outputs.still_needs_attempt == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the primary credential run?
      id: c1
      if: steps.s0.outputs.still_needs_attempt == 'true'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a1.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    # `still_needs_attempt` is the ladder's cumulative state and the only gate a
    # CREDENTIAL rung reads (the free same-credential retry below adds one further
    # condition). It stays 'true' until some rung reports a non-errored run,
    # which is what keeps a gap in the token list from truncating the ladder: a
    # skipped rung's check emits an EMPTY errored, and empty is not success, so the
    # pending state passes through to the tiers that do hold a credential. Gating a
    # rung on its immediate predecessor's check instead would strand every tier
    # after the first unset one, however many live credentials follow it.
    - name: Ladder state after the primary attempt
      id: s1
      shell: bash
      env:
        PRIOR: ${{ steps.s0.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c1.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    # The free retry. claude-run-errored.sh reports zero_cost=true only when the
    # attempt billed nothing (total_cost_usd == 0, or no log at all), which proves
    # inference was never reached — so a transient provider-side blip and a dead
    # token look identical here, and one more attempt on the SAME credential costs
    # nothing either way: it succeeds if the fault was the blip and fails the same
    # way if the token is dead. Without it a blip is answered only by walking to the
    # NEXT credential, which a caller configuring no fallback secrets does not have
    # — the attempt is then lost with zero retries. A failure that DID bill reached
    # inference and failed on the work itself, so zero_cost=false skips this rung
    # rather than spend real money failing the same way twice.
    - name: Back off before the free same-credential retry
      if: steps.s1.outputs.still_needs_attempt == 'true' && steps.c1.outputs.zero_cost == 'true'
      shell: bash
      env:
        # Straddling the blip is the entire point: the failure returns in well under
        # a second, so a back-to-back retry hits the same broken instant. Ten seconds
        # is the credential ladder's own first step — long enough to outlast a
        # transient fault, short enough that a free retry cannot dominate wall clock.
        BACKOFF_SECONDS: "10"
      run: sleep "$BACKOFF_SECONDS"

    - name: Retry on the primary credential
      id: a1r
      if: steps.s1.outputs.still_needs_attempt == 'true' && steps.c1.outputs.zero_cost == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the same-credential retry run?
      id: c1r
      if: steps.s1.outputs.still_needs_attempt == 'true' && steps.c1.outputs.zero_cost == 'true'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a1r.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    # The free retry joins the same cumulative state the credential rungs use, so a
    # retry that WORKED ends the ladder and a retry that did not leaves the pending
    # state untouched for the fallback tiers. Every rung below therefore gates on
    # s1r, not s1; a skipped retry emits an empty errored, which is not success, so
    # the gap handling that lets an unset tier be stepped over covers this rung too.
    - name: Ladder state after the free same-credential retry
      id: s1r
      shell: bash
      env:
        PRIOR: ${{ steps.s1.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c1r.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    # A dead/expired credential is rejected in roughly half a second without ever
    # reaching inference, so back-to-back rungs spend the whole ladder inside a few
    # seconds — long enough for one provider-side blip to take out all seven tokens
    # on a request the same config serves fine a minute later. The waits escalate
    # 10/15/20/30/45/60s, so the last rung lands ~180s after the first and the ladder
    # straddles a blip, while the added wall clock stays around three minutes.
    - name: Back off before the second-tier attempt
      if: steps.s1r.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback != ''
      shell: bash
      env:
        BACKOFF_SECONDS: "10"
      run: sleep "$BACKOFF_SECONDS"

    - name: Retry with the second-tier credential
      id: a2
      if: steps.s1r.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token_fallback }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the second-tier credential run?
      id: c2
      # Same gate as a2, so a skipped attempt's check emits nothing and the
      # newest-first output resolution keeps reporting the attempt that did run.
      if: steps.s1r.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a2.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    - name: Ladder state after the second-tier attempt
      id: s2
      shell: bash
      env:
        PRIOR: ${{ steps.s1r.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c2.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    # The CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 rung. Ids stay a2b/c2b/s2b rather
    # than renumbering a3..a6: the ladder's step ids appear in the outputs above
    # and in the propagate gate below, so inserting a rung by shifting names is
    # how one of those expressions goes stale.
    - name: Back off before the FALLBACK_2 attempt
      if: steps.s2.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_2 != ''
      shell: bash
      env:
        BACKOFF_SECONDS: "15"
      run: sleep "$BACKOFF_SECONDS"

    - name: Retry with the FALLBACK_2 credential
      id: a2b
      if: steps.s2.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_2 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token_fallback_2 }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the FALLBACK_2 credential run?
      id: c2b
      if: steps.s2.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_2 != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a2b.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    - name: Ladder state after the FALLBACK_2 attempt
      id: s2b
      shell: bash
      env:
        PRIOR: ${{ steps.s2.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c2b.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    - name: Back off before the third-tier attempt
      if: steps.s2b.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_3 != ''
      shell: bash
      env:
        BACKOFF_SECONDS: "20"
      run: sleep "$BACKOFF_SECONDS"

    - name: Retry with the third-tier credential
      id: a3
      if: steps.s2b.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_3 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token_fallback_3 }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the third-tier credential run?
      id: c3
      if: steps.s2b.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_3 != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a3.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    - name: Ladder state after the third-tier attempt
      id: s3
      shell: bash
      env:
        PRIOR: ${{ steps.s2b.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c3.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    - name: Back off before the fourth-tier attempt
      if: steps.s3.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_4 != ''
      shell: bash
      env:
        BACKOFF_SECONDS: "30"
      run: sleep "$BACKOFF_SECONDS"

    - name: Retry with the fourth-tier credential
      id: a4
      if: steps.s3.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_4 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token_fallback_4 }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the fourth-tier credential run?
      id: c4
      if: steps.s3.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_4 != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a4.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    - name: Ladder state after the fourth-tier attempt
      id: s4
      shell: bash
      env:
        PRIOR: ${{ steps.s3.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c4.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    - name: Back off before the fifth-tier attempt
      if: steps.s4.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_5 != ''
      shell: bash
      env:
        BACKOFF_SECONDS: "45"
      run: sleep "$BACKOFF_SECONDS"

    - name: Retry with the fifth-tier credential
      id: a5
      if: steps.s4.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_5 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token_fallback_5 }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the fifth-tier credential run?
      id: c5
      if: steps.s4.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_5 != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a5.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    - name: Ladder state after the fifth-tier attempt
      id: s5
      shell: bash
      env:
        PRIOR: ${{ steps.s4.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c5.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    - name: Back off before the sixth-tier attempt
      if: steps.s5.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_6 != ''
      shell: bash
      env:
        BACKOFF_SECONDS: "60"
      run: sleep "$BACKOFF_SECONDS"

    - name: Retry with the sixth-tier credential
      id: a6
      if: steps.s5.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_6 != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
      env:
        GH_TOKEN: ${{ inputs.gh_token || inputs.github_token }}
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token_fallback_6 }}
        github_token: ${{ inputs.github_token }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        allowed_bots: ${{ inputs.allowed_bots }}
        claude_args: >-
          --model ${{ inputs.model }}
          ${{ inputs.claude_args }}
        prompt: ${{ steps.compose_prompt.outputs.prompt }}

    - name: Did the sixth-tier credential run?
      id: c6
      if: steps.s5.outputs.still_needs_attempt == 'true' && inputs.oauth_token_fallback_6 != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a6.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/claude-run-errored.sh"

    - name: Ladder state after the sixth-tier attempt
      id: s6
      shell: bash
      env:
        PRIOR: ${{ steps.s5.outputs.still_needs_attempt }}
        ERRORED: ${{ steps.c6.outputs.errored }}
      run: |
        set -euo pipefail
        still="false"
        if [[ "$PRIOR" == "true" && "$ERRORED" != "false" ]]; then
          still="true"
        fi
        echo "still_needs_attempt=${still}" >>"$GITHUB_OUTPUT"

    # Sanitizer's callers rely on the composite itself failing when no credential
    # worked: they read execution_file for the cost footer and would otherwise
    # carry on as if the agent had run. This is the hard gate the ladder's own
    # `errored` output only reports. c0 sits LAST in this OR-chain rather than
    # first: it is the earliest-run rung now, not the latest, and the chain
    # resolves to whichever check actually ran most recently.
    - name: Propagate the ladder result
      if: >-
        (steps.c6.outputs.errored || steps.c5.outputs.errored || steps.c4.outputs.errored ||
         steps.c3.outputs.errored || steps.c2b.outputs.errored || steps.c2.outputs.errored ||
         steps.c1r.outputs.errored || steps.c1.outputs.errored || steps.c0.outputs.errored) == 'true'
      shell: bash
      run: |
        echo "::error::claude-run: every configured Claude credential failed (set CLAUDE_CODE_OAUTH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN_FALLBACK[_2..6], or the optional metered anthropic_api_key)." >&2
        exit 1
    # The gate and this composite's own `execution_file` output both need the log
    # of whichever rung actually ran. Resolve it ONCE here, newest-first, so the
    # two cannot drift: sync #169 pointed the gate at a `steps.resolve_log` this
    # six-rung ladder never had, and a missing step id is not an Actions error —
    # the expression just renders empty. Every gated caller then failed with
    # "produced no execution log" even when a rung had run Claude to completion.
    # No `if:` — a ladder where every credential failed exits at the step above.
    - name: Resolve the execution log of the rung that ran
      id: resolve_log
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.a6.outputs.execution_file || steps.a5.outputs.execution_file || steps.a4.outputs.execution_file || steps.a3.outputs.execution_file || steps.a2b.outputs.execution_file || steps.a2.outputs.execution_file || steps.a1r.outputs.execution_file || steps.a1.outputs.execution_file || steps.a0.outputs.execution_file }}
      run: echo "execution_file=${EXECUTION_FILE}" >>"$GITHUB_OUTPUT"

    # A rung exiting 0 is NOT proof Claude ran: an auth failure, a crash before
    # the result event, and a corrupt log all leave the step green. This gate is
    # what turns that silent skip into a red step. It lives HERE, not at each
    # call site, so a new caller inherits it instead of having to remember it —
    # the obligation was previously open-coded and 5 of 7 call sites had missed
    # it. Removing this step re-opens every caller to a silent no-op run.
    - name: Gate on the execution log (is_error / missing / corrupt)
      id: gate
      if: inputs.gate_execution == 'true'
      shell: bash
      env:
        CONTEXT: ${{ inputs.gate_context }}
        EXECUTION_FILE: ${{ steps.resolve_log.outputs.execution_file }}
      run: bash "${GITHUB_ACTION_PATH}/check-claude-execution.sh"
