name: Plugin dist autofix

# The plugin ships a committed esbuild bundle built from this repo's own src/,
# so the artifact changes whenever the engine or the hook sources do.
# Regenerating it by hand is the step a dependency-bump PR cannot take, so this
# rebuilds and pushes the artifact on any PR that touches a build input. The
# reproducibility test (committed bundle == fresh build) then passes on the
# pushed commit; when this workflow cannot run, that test stays red and blocks
# the merge — the artifact is never silently stale.
#
# SECURITY — split into two jobs so the push token and PR-authored code never
# share a job. `regenerate` checks out the PR head and runs the build (which
# runs the PR's OWN `pnpm install`/build lifecycle scripts) with no secret
# anywhere in its environment. It tars up only the files the build changed
# (some are compiled binaries, so a text `git diff` patch cannot carry them)
# and uploads that tarball as a build artifact — never a secret, never
# executable in the next job's context. `push` holds AUTOFIX_TOKEN_ORG and runs
# no PR-defined script at all: extracting a tarball and `git commit`/`git push`
# are this workflow's own commands, not the PR's package.json.
# trusted-base-ok: `push` checks out the PR head so the commit/push land on the
# right branch, but executes nothing resolved from that checkout — only `tar`
# and `git`, system binaries, applying a tarball this same workflow produced.
# No workspace file is ever run as a program, so there is nothing for a
# rewritten package.json/action.yml/script in the PR to reach.
on:
  # not-required-check — this workflow pushes a regenerated artifact onto the PR
  # branch; the reproducibility test in the Required node-tests check is what
  # gates the merge, so a paths filter here strands nothing.
  pull_request: # not-required-check
    paths:
      - package.json
      - pnpm-lock.yaml
      - claude-hooks/**
      # The engine itself: the bundle inlines src/ and the zipapp installs a
      # wheel built from python/, so either one moves the committed artifacts.
      - src/**
      - python/**
      - plugin/scripts/**
      # The shared, hardened esbuild config the plugin build calls — a change
      # here moves the artifact just as surely as a change to plugin/scripts/.
      - scripts/lib/**
      - plugin/requirements.in
      - plugin/requirements.txt

concurrency:
  group: plugin-dist-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    # Same-repo PRs only — a token cannot push to a fork's branch. Unlike the
    # Prettier autofix this DOES run on bot-authored PRs: a Renovate dependency
    # bump can change the committed artifacts, and excluding bots would leave
    # every such PR red on the reproducibility test with no way for the bot to
    # fix it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Regenerating the hook-binary manifest compiles four bun binaries (~100 MB
    # each), downloading each cross-target runtime on a cold cache.
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      # The zipapp rebuild resolves the daemon's third-party tree from PyPI, so it
      # needs uv.
      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          setup-python: "true"

      # This job holds no secret at all — the build runs the PR's OWN lifecycle
      # scripts with nothing to exfiltrate.
      - name: Rebuild the plugin artifacts
        id: build
        run: |
          node plugin/scripts/build-plugin.mjs
          # --if-stale: re-lock ONLY when the committed lock still names a
          # published engine. An unconditional re-lock here would pull in new
          # transitives on every artifact-regenerating PR, which is the drift the
          # lock exists to stop.
          node plugin/scripts/lock-redactor-deps.mjs --if-stale
          node plugin/scripts/build-redactor-pyz.mjs
          # --if-stale: skip the ~4-target bun compile when the committed digest
          # manifest already matches this tree (same bundle, same pinned bun).
          node plugin/scripts/build-hook-binaries.mjs --if-stale
          # `git diff --quiet` exits non-zero exactly when the build changed files.
          if git diff --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Plugin artifacts already current; nothing to regenerate."
            exit 0
          fi
          # tar, not a text patch: several changed files are compiled binaries a
          # `git diff` patch cannot carry byte-for-byte.
          git diff --name-only -z >"${RUNNER_TEMP}/changed-files.z"
          tar --null -T "${RUNNER_TEMP}/changed-files.z" -czf "${RUNNER_TEMP}/dist-changes.tar.gz"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: plugin-dist-autofix-changes
          path: ${{ runner.temp }}/dist-changes.tar.gz
          retention-days: 1

  push:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A GITHUB_TOKEN push does not re-trigger workflows, so the Required
      # node-tests check would stay pending on the fixed commit and block the PR.
      # `secrets` can't be read in a job-level `if`, hence this preflight step.
      - name: Check for AUTOFIX_TOKEN_ORG
        id: guard
        env:
          AUTOFIX_TOKEN_ORG: ${{ secrets.AUTOFIX_TOKEN_ORG }}
        run: |
          if [ -n "$AUTOFIX_TOKEN_ORG" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice::AUTOFIX_TOKEN_ORG secret is not set; skipping plugin dist regeneration. The reproducibility test will fail until the bundle is rebuilt and committed by hand."
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: plugin-dist-autofix-changes
          path: ${{ runner.temp }}

      # No PR-defined script runs in this job — extracting a tarball this
      # workflow's own tar command produced, then a plain commit, is this
      # workflow's own command, not the PR's package.json.
      - name: Apply the rebuilt artifacts and commit
        id: commit
        if: steps.guard.outputs.enabled == 'true'
        run: |
          tar -xzf "${RUNNER_TEMP}/dist-changes.tar.gz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(plugin): regenerate dist from this tree"

      # Push in a dedicated step whose only secret is the PAT. No PR code runs
      # in this job, so the token cannot be exfiltrated.
      - name: Push the regenerated artifacts
        if: steps.guard.outputs.enabled == 'true'
        env:
          AUTOFIX_TOKEN_ORG: ${{ secrets.AUTOFIX_TOKEN_ORG }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push \
            "https://x-access-token:${AUTOFIX_TOKEN_ORG}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${HEAD_REF}"
