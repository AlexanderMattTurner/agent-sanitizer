name: Format autofix

# Auto-apply Prettier to PR branches and push the fix, so a formatting slip is
# corrected in place instead of just failing the Required "Format check". The
# pushed commit re-triggers format-check (see the token note below), which then
# passes on the fixed commit.
#
# SECURITY — split into two jobs so the push token and PR-authored code never
# share a job. `format` checks out the PR head and runs its OWN `pnpm format`
# script (and whatever `install`/`prepare` lifecycle scripts that triggers) with
# no secret anywhere in its environment; a malicious package.json cannot reach a
# token that job never holds. It uploads only a patch file as a build artifact —
# never a secret, never executable in the next job's context. `push` holds
# AUTOFIX_TOKEN_ORG and runs no PR-defined script at all: `git apply` on a patch
# and `git commit`/`git push` are all base-branch-trusted git plumbing.
# trusted-base-ok: `push` checks out the PR head so `git apply`/`git push` land
# on the right branch, but executes nothing resolved from that checkout — only
# `git`, a system binary, applying a patch this same workflow produced. No
# workspace file is ever run as a program, so there is nothing for a rewritten
# package.json/action.yml/script in the PR to reach.
on:
  pull_request:

concurrency:
  group: format-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    # Same-repo PRs only — a token cannot push to a fork's branch — and never on
    # bot-authored PRs: bots (dependabot, etc.) manage their own commits, and
    # claude-code-action rejects bot actors, so autofixing them just burns CI.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env

      # This job holds no secret at all — `pnpm format` (and the install/prepare
      # lifecycle scripts it can trigger) runs the PR's OWN code with nothing to
      # exfiltrate.
      - name: Apply Prettier and produce a patch
        id: format
        if: hashFiles('package.json') != ''
        run: |
          pnpm format
          # `git diff --quiet` exits non-zero exactly when Prettier changed files.
          if git diff --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Already Prettier-clean; nothing to autofix."
            exit 0
          fi
          git diff >"${RUNNER_TEMP}/format.patch"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - if: steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: format-autofix-patch
          path: ${{ runner.temp }}/format.patch
          retention-days: 1

  push:
    needs: format
    if: needs.format.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Autofix is useless without a PAT/App token: a GITHUB_TOKEN push does not
      # re-trigger workflows, so the Required format-check would stay pending on
      # the fixed commit and block the PR. So gate the real work on the secret
      # being present. `secrets` can't be read in a job-level `if`, hence this
      # preflight step that exposes it as a step output; when it's absent every
      # later step is skipped and the job ends green (a no-op), instead of the
      # checkout failing on an empty token.
      - name: Check for AUTOFIX_TOKEN_ORG
        id: guard
        env:
          AUTOFIX_TOKEN_ORG: ${{ secrets.AUTOFIX_TOKEN_ORG }}
        run: |
          if [ -n "$AUTOFIX_TOKEN_ORG" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice::AUTOFIX_TOKEN_ORG secret is not set; skipping autofix. Add a fine-grained PAT (contents: write) so the fix-commit re-triggers format-check."
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: format-autofix-patch
          path: ${{ runner.temp }}

      # No PR-defined script runs in this job — `git apply` on a patch produced
      # by the format job, then a plain commit, is git plumbing this job's own
      # command, not the PR's package.json.
      - name: Apply the patch and commit
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git apply "${RUNNER_TEMP}/format.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # `style:` keeps the commit Conventional-Commits valid (the commit-msg
          # hook runs — postinstall set core.hooksPath).
          git commit -m "style: apply prettier"

      # Push in a dedicated step whose only secret is the PAT. No PR code runs in
      # this job, so the token cannot be exfiltrated. A PAT (not GITHUB_TOKEN) is
      # required so the pushed commit re-triggers the Required format-check.
      - name: Push Prettier fix
        if: steps.guard.outputs.enabled == 'true'
        env:
          AUTOFIX_TOKEN_ORG: ${{ secrets.AUTOFIX_TOKEN_ORG }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push \
            "https://x-access-token:${AUTOFIX_TOKEN_ORG}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${HEAD_REF}"
