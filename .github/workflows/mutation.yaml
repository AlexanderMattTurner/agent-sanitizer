name: Mutation tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**/*.mjs"
      - "claude-hooks/**/*.mjs"
      - "bin/**/*.mjs"
      - "test/**/*.mjs"
      - "scripts/shipped-sources.mjs"
      - "scripts/mutate.mjs"
      - "stryker.conf.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-base-env/action.yaml"
      - ".github/mutation-shards.json"
      - ".github/workflows/mutation.yaml"
      - ".github/scripts/mutation-changed.sh"
      - ".github/scripts/run-mutation-dry-run.sh"
      - ".github/scripts/run-mutation-shard.sh"
      - ".github/scripts/aggregate-mutation.mjs"
      - ".github/scripts/expand-shards.mjs"
  # No paths filter on pull_request: this is a Required check, and a workflow-level
  # path filter would skip the whole workflow (including the mutation-passed
  # reporter) on PRs that don't touch these paths, stranding the check at
  # "Expected — Waiting". The changes job below cheaply no-ops via
  # mutation-changed.sh when nothing mutation-relevant changed, so the gate still
  # reports green.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap gate: decide whether the expensive shards run at all, and hand the
  # shard matrix to the mutation job from the committed shard list.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # mutation-changed.sh diffs the PR head against its base; full history
          # is the simplest way to guarantee the base commit resolves.
          fetch-depth: 0

      - name: Skip when no mutation-relevant files changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Exit contract: 0 = relevant changes, 1 = nothing relevant, >=2 = the
        # script could not determine relevance (e.g. it failed to parse the
        # on.push.paths SSOT out of this workflow) — fail the job rather than
        # silently skipping a real gate.
        run: |
          rc=0
          bash .github/scripts/mutation-changed.sh || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No mutation-relevant files changed, skipping Stryker"
          else
            exit "$rc"
          fi

      - name: Load shard matrix
        id: shards
        # Expand the declarative config into concrete line-range slices from the
        # file's current length (see .github/scripts/expand-shards.mjs); the
        # aggregate gate calls the same expander so their shard counts match.
        run: echo "shards=$(node .github/scripts/expand-shards.mjs)" >> "$GITHUB_OUTPUT"

  # The fast oracle for "does the suite survive instrumentation at all?". Stryker
  # aborts a shard whose initial dry run is red, so ONE test that asserts on the
  # syntactic form of an instrumented file fails every shard in the matrix — 25
  # minutes each, all with the same cause. This runs that dry run alone, over the
  # whole shipped-source set, and reports in a few minutes.
  #
  # Deliberately NOT a `needs:` of the mutation matrix. Gating the shards on it
  # would save the failure path but add its latency to every green run, and the
  # shards' own dry runs remain the backstop either way.
  dry-run: # required-check: false  # rolled up by mutation-passed (which needs: dry-run)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same fixed fast-check seed the shards pin: a property test that rolled a
    # counterexample here would read as an instrumentation failure it is not.
    env:
      FC_REPRODUCIBLE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        # The dry run executes the WHOLE suite, including the rehydrate property
        # test that drives the real Python redactor, so it needs uv + Python.
        with:
          setup-python: "true"

      - name: Stryker dry run over every shipped source
        run: bash .github/scripts/run-mutation-dry-run.sh

  # Every SHIPPED .mjs — src/, claude-hooks/ and bin/ alike — is split into
  # disjoint slices (line ranges for the big files, whole files for the rest) so
  # the slices run in parallel across runners. Each shard runs Stryker
  # incrementally with the break threshold disabled and uploads its JSON report;
  # the aggregate job scores each gated scope and applies its threshold.
  mutation:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Mutation testing needs a deterministic oracle: Stryker aborts a shard if
    # any test fails in its initial dry run, so a randomized property test that
    # rolls a counterexample on one shard's seed would flake the whole gate.
    # FC_REPRODUCIBLE pins fast-check to the fixed seed (see test/test-helpers.mjs)
    # so every shard's dry run is stable and green.
    env:
      FC_REPRODUCIBLE: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        # Stryker's dry run executes the whole suite, including the rehydrate
        # property test that drives the real Python redactor, so every shard
        # needs uv + the Python deps.
        with:
          setup-python: "true"

      # Restore this shard's incremental result file so only mutants whose source
      # or covering tests changed since the last run are re-evaluated; the rest
      # reuse their prior verdict. Per-shard key (slices are disjoint, so their
      # incremental files must not collide); prefix restore-keys pull the most
      # recent entry for this shard, including the baseline saved on main.
      - name: Restore Stryker incremental cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.shard.id }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ matrix.shard.id }}-

      - name: Run mutation testing shard
        env:
          MUTATE: ${{ matrix.shard.mutate }}
        run: bash .github/scripts/run-mutation-shard.sh

      - name: Save Stryker incremental cache
        if: ${{ always() && hashFiles('reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.shard.id }}-${{ github.run_id }}

      - name: Upload shard report
        if: ${{ always() && hashFiles('reports/mutation/mutation.json') != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mutation-report-${{ matrix.shard.id }}
          path: reports/mutation/mutation.json
          retention-days: 14

  # Sum every shard's JSON into the project-wide mutation score and apply the
  # break threshold from stryker.conf.json. This is the real gate; the shards
  # themselves run with break disabled.
  aggregate: # required-check: false  # rolled up by mutation-passed (which needs: aggregate)
    needs: [changes, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip when shards did not run
        if: needs.changes.outputs.run != 'true'
        run: echo "::notice::No mutation-relevant files changed, nothing to aggregate"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: needs.changes.outputs.run == 'true'
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: needs.changes.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download shard reports
        if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: mutation-report-*
          path: shard-reports

      - name: Aggregate and apply threshold
        if: needs.changes.outputs.run == 'true'
        run: node .github/scripts/aggregate-mutation.mjs shard-reports

  # Stable Required check: runs even when upstream jobs are cancelled/skipped, so
  # a protected branch never gets stuck on a check that never reports.
  mutation-passed: # required-check: true
    if: always()
    needs: [changes, dry-run, mutation, aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/report-job-result
            .github/scripts
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: ${{ needs.changes.outputs.run }}
          decide-result: ${{ needs.changes.result }}
          # Worst-of the three work jobs. Reporting only `mutation` here would
          # let a red aggregate (the real threshold gate) ride through green —
          # the reporter takes one result, so the combining has to happen at the
          # call site. Passing the failing job's own result (rather than a
          # flattened 'failure') keeps the reporter's cancelled-vs-superseded
          # adjudication intact. dry-run comes first: when it fails the shards
          # fail with it, and its result is the one that names the cause.
          result: >-
            ${{ needs.dry-run.result != 'success' && needs.dry-run.result
             || needs.mutation.result != 'success' && needs.mutation.result
             || needs.aggregate.result }}
