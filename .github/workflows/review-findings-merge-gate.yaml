name: Review-findings merge gate

# The merge queue's leg of the review-findings gate. The queue evaluates the
# required-check set on its own ephemeral sha, so the same predicate
# (review-findings-gate.sh — see review-findings-gate.yaml for the full model)
# must report there too; this job's own result is that report.
#
# This is a separate file from review-findings-gate.yaml ON PURPOSE, and it must
# NEVER gain a PR-event trigger: the required check's job sitting in a workflow
# that also fires on PR events would be reported `skipped` on every PR-event run,
# and GitHub counts a `skipped` check run as satisfying a required check — so a
# stray PR event (any label, any review comment) would overwrite a red gate on
# the head with a passing skipped instance. merge_group-only triggers are what
# make that impossible.
#
# This job is also where the required-check CONTEXT NAME lives: sync-required-checks
# reads the `# required-check: true` marker below and registers this job's `name:`
# in the ruleset, and review-findings-gate.sh posts its PR-head check runs under
# that same name. This repository has no merge queue enabled, so the job itself
# does not fire today and the PR-head post is the only reporting surface; the leg
# is correct the moment a queue is turned on.

on:
  merge_group:

permissions: {}

jobs:
  merge_gate:
    name: Review findings resolved # required-check: true
    # The job name is the required-check context sync-required-checks registers,
    # and review-findings-gate.sh posts its PR-head check runs under the SAME
    # name — one context, two reporting surfaces (queue sha here, PR head sha
    # from review-findings-gate.yaml's evaluate job and the resolver step).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # sparse-checkout the trusted gate script
      pull-requests: read # read the PR's reviews and threads
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the trusted gate script (default branch)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            config
          sparse-checkout-cone-mode: false
      - name: Evaluate the gate for the queued PR
        env:
          # refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha> — the queue names
          # the PR it is testing in the ephemeral ref.
          MG_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [[ ! "$MG_REF" =~ /pr-([0-9]+)- ]]; then
            echo "cannot parse a PR number from merge-group ref '${MG_REF}'" >&2
            exit 1
          fi
          PR="${BASH_REMATCH[1]}"
          export PR
          bash .github/scripts/review-findings-gate.sh
