name: Node tests

# No paths filter: node-tests-passed is a required status check, so the workflow
# must always fire and report — a path-gated required check hangs at
# "Expected — Waiting" forever when a PR doesn't touch the filtered paths. The
# test job no-ops when no test script is configured, so it stays cheap.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        # The rehydrate property test drives the real Python redactor
        # (agent_sanitizer.secrets) as its single source of truth, so the
        # suite needs uv + the Python deps available.
        with:
          setup-python: "true"

      # The plugin suites run the built plugin. `pnpm install` (prepare) wrote
      # the offline half; the zipapp and the engine wheel need PyPI, so they are
      # built here, from this tree, before any suite reads them.
      - name: Build the redactor zipapp
        run: pnpm build:redactor

      - name: Check if test script is configured
        id: check
        run: bash .github/scripts/script-configured-output.sh test configured

      - name: Run tests
        if: steps.check.outputs.configured == 'true'
        run: pnpm test
        # Fixed-seed fast-check replay (see test/test-helpers.mjs::fcRunOptions):
        # mutation.yaml pins this and fuzz-nightly.yaml documents this job as
        # pinned too; the nightly unseeded run is the exploratory counterpart.
        env:
          FC_REPRODUCIBLE: "1"

      # post-pr-review.mjs imports agent-sanitizer by name, and
      # .github/scripts/package.json ends the package scope there, so the
      # self-reference never resolves — the import needs the same
      # .github/scripts/node_modules install the review workflow does. It has to
      # precede the discovered run below, which includes that suite.
      - name: Install the input sanitizer
        run: bash .github/scripts/install-sanitizer.sh

      # `node --test`'s default discovery skips dot-directories, so nothing
      # under .github/scripts runs via `pnpm test`. This DISCOVERS every suite
      # there (git ls-files) rather than naming them. The hand-written list it
      # replaces had rotted in both directions at once: its `auto-resolve-*`
      # glob needs a literal hyphen and does not cross `/`, so it matched only
      # the four FLAT suites — whose scripts nothing invoked any more — while
      # the nine live suites under auto-resolve/ ran in no job at all, and five
      # more (check-claude-execution, sanitize-pr-input, pr-review-advisory,
      # resolve-generated, phone-home-extract) had never been listed. The script
      # fails loud on an empty discovery, so this step cannot go decorative
      # again.
      - name: Run the .github/scripts test suites
        run: bash .github/scripts/run-script-tests.sh

      # Same dot-directory blind spot. This suite pins that CI carries
      # subscription OAuth credentials only — no metered API-key rung in the
      # ladder, no `x-api-key` default that would authenticate one anyway, and no
      # workflow or composite action handing a key to Claude. Left to `pnpm
      # test`'s discovery these guards would be decorative: re-adding the rung
      # would merge green, which is the failure mode they exist to prevent.
      - name: Run Anthropic credential-ladder guards
        run: node --test .github/scripts/lib/anthropic-ladder.test.mjs

      # Named explicitly rather than left to `pnpm test`'s discovery. This suite
      # gates the plugin as it ships — the built bundle, the launcher and every
      # hook's fail-closed verdict — so which invocation reaches it must be
      # visible here, not inferred from a default that a future config change
      # could silently narrow.
      - name: Run plugin tests
        run: node --test plugin/test/*.test.mjs

      # `pnpm test` runs this suite under c8, which multiplies these paths'
      # cost up to ~7x, so every latency gate stands down there and would be
      # checked nowhere without this uninstrumented run.
      - name: Run the hook latency gates uninstrumented
        run: node --test test/hook-latency.test.mjs

      # claude-hooks/ and bin/ DO carry a coverage floor now — a separate, lower
      # ratchet from src/'s 100% (see `SCOPES` in scripts/coverage.mjs), applied
      # by `pnpm test` above. It is deliberately below the measured value: part
      # of this code is driven the way Claude Code drives it, as subprocesses
      # running the built BUNDLE, and those lines are attributed to the
      # bundle rather than back to the source, so the ratio moves when a file
      # merely grows. The ratio is a backstop, not the real gate; the behavioural
      # gates still hold this code — the degraded-verdict matrix, the env-var
      # coverage enumeration, the egress pin, the fail-closed peer test and the
      # live-engine job.

  # The only leg that runs the REAL redaction engine. Everything else stubs the
  # daemon in-process, so without this a pinned-engine bump could automerge green
  # with a broken redactor: the wire protocol would be satisfied by the stub and
  # the engine itself never executed.
  live-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          setup-python: "true"

      # The engine wheel the provisioner installs is built beside the zipapp,
      # from this tree; the hook bundle was built by `pnpm install` (prepare).
      - name: Build the redactor zipapp
        run: pnpm build:redactor

      # Provisions the built engine wheel into a scratch CLAUDE_PLUGIN_DATA,
      # exactly as the SessionStart provisioner does, then drives all four hooks
      # through the launcher against a golden corpus.
      - name: Drive the hooks against the real engine
        run: node .github/scripts/plugin-live-engine.mjs

  # Stable Required check: runs even when `test` is cancelled/skipped, so a
  # protected branch never gets stuck on a check that never reports.
  node-tests-passed: # required-check: true
    if: always()
    needs: [test, live-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/report-job-result
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: "true"
          decide-result: "success"
          # Worst-of the two work jobs. Reporting only `test` here would let a
          # red live-engine ride through green — the reporter takes one result,
          # so the combining has to happen at the call site. Passing the failing
          # job's own result (rather than a flattened 'failure') keeps the
          # reporter's cancelled-vs-superseded adjudication intact.
          result: >-
            ${{ needs.test.result != 'success' && needs.test.result
             || needs.live-engine.result }}
