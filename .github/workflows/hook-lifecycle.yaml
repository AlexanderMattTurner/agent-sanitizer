name: Hook lifecycle

# Runs the full Claude hook lifecycle (session setup -> pre-commit -> pre-push)
# on a clean checkout, so a broken hook is caught in CI rather than in a session.

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  decide:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/decide-reusable.yaml
    with:
      filters: |
        run:
          - '.claude/hooks/**'
          - '.hooks/**'
          - 'setup.sh'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'pyproject.toml'
          - 'uv.lock'
          - '.pre-commit-config.yaml'
          - '.github/scripts/run-hook-lifecycle.sh'
          - '.github/scripts/time-session-setup.sh'
          - '.github/scripts/lib/phase-timer.bash'
          - '.github/scripts/append-timing-history.sh'
          - '.github/scripts/render-timing-trend.mjs'
          - '.github/scripts/lib/retry.bash'
          - '.github/scripts/check-symlinks.sh'
          - '.github/actions/setup-base-env/**'
          - '.github/workflows/hook-lifecycle.yaml'
          # This job's setup runs through the composite action and the reusable
          # decide workflow; a change to either can break the lifecycle, so the
          # gate must open when they change (otherwise it fails open — skipping
          # the job exactly when the dependency it relies on changed).
          - '.github/actions/setup-base-env/action.yaml'
          - '.github/workflows/decide-reusable.yaml'

  hook-lifecycle:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env
        with:
          setup-python: "true"

      - name: Run hook lifecycle
        run: bash .github/scripts/run-hook-lifecycle.sh

  # End-to-end setup timing. Deliberately does NOT use setup-base-env: that
  # composite installs node_modules and syncs the venv first, so session-setup
  # measured after it is a warm-cache number that hides what a fresh container
  # actually waits through. Here only the tool binaries are provisioned (with
  # their caches disabled) and session-setup pays for everything else itself.
  # Advisory: reports durations, never fails on a slow run.
  setup-timing:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # No `cache: pnpm` — a warm store is exactly what this job must not have.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Time session setup end-to-end
        env:
          TIMER_JSON_OUT: ${{ runner.temp }}/setup-timing.json
        run: bash .github/scripts/time-session-setup.sh

      # Handed to record-setup-timing rather than pushed from here: this job
      # runs `pnpm install` and `uv sync`, so it must never hold a token that
      # can write to the repository.
      - name: Upload the timing record
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: setup-timing
          path: ${{ runner.temp }}/setup-timing.json
          if-no-files-found: error
          retention-days: 7

  # Append this commit's numbers to the timing-history branch and render the
  # over-time trend. Push-to-main only: a PR's numbers are measured on a commit
  # that may never land, so mixing them into the series would make the trend
  # meaningless. PRs still get the per-run waterfall from the job above.
  record-setup-timing:
    needs: [decide, setup-timing]
    if: >-
      needs.decide.outputs.run == 'true'
      && needs.setup-timing.result == 'success'
      && github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # persist-credentials stays on: the recorder pushes the history branch
      # through this checkout's credentials. Nothing else runs in this job.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked] — the persisted credential is the point; see above
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: setup-timing
          path: ${{ runner.temp }}/timing

      - name: Record the run and render the trend
        env:
          TIMING_JSON: ${{ runner.temp }}/timing/setup-timing.json
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TREND_TITLE: Session setup
          # The cold number is the one a fresh session pays; the total also
          # carries the warm re-run, so both are worth watching.
          TREND_SERIES: |
            total
            session-setup (cold cache)
        run: bash .github/scripts/append-timing-history.sh

  hook-lifecycle-passed: # required-check: true
    if: always()
    needs: [decide, hook-lifecycle, setup-timing, record-setup-timing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/report-job-result
            .github/scripts
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: ${{ needs.decide.outputs.run }}
          decide-result: ${{ needs.decide.result }}
          # Worst-of both work jobs: the reporter takes one result, so the
          # combining happens here. setup-timing runs the real bootstrap, so a
          # failure there is a broken setup — advisory only means it never
          # fails on a slow run, not that its crashes are ignored. Passing the
          # failing job's own result keeps the reporter's cancelled-vs-
          # superseded adjudication intact.
          # record-setup-timing is skipped on every PR (it only records
          # push-to-main), and a skip there is benign, so it is compared
          # against both.
          result: >-
            ${{ needs.hook-lifecycle.result != 'success' && needs.hook-lifecycle.result
             || needs.setup-timing.result != 'success' && needs.setup-timing.result
             || (needs.record-setup-timing.result == 'skipped' && 'success')
             || needs.record-setup-timing.result }}
