name: CI failure notify

# Post-merge (push-to-main) and scheduled workflow failures emit no PR webhook,
# so they rot unnoticed — releases have silently stopped for weeks downstream.
# This workflow converts such a failure into a phone push (via ntfy). It used to
# file a deduplicated tracking issue instead; that only moved the ignoring to the
# issue tracker, and left a backlog nobody closed. The run itself is the record —
# the notification's click target is the failing run.
#
# The notification is a no-op unless the GH_NTFY_SUBJECT secret is set, so a repo
# that has not opted in is unaffected. Set GH_NTFY_URL to target a self-hosted
# ntfy server (defaults to https://ntfy.sh).
#
# `workflow_run` has no wildcard, so `workflows:` below must name every
# workflow in this repo with a `push:` or `schedule:` trigger (matched by the
# workflow's `name:`). A ci-truth-serum hook (check-failure-notifier-coverage)
# keeps this list in sync with the tree. Binding is by NAME, not filename: a
# repo that keeps its own release workflow instead of the template's
# auto-version.yaml must give it the name listed here or add its own.
# The dangerous-triggers finding targets workflows that check out or execute
# the triggering ref's code with write credentials; this one checks out only its
# own default-branch action dir, credential-less, and never runs repo code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    types: [completed]
    workflows:
      - Auto-resolve merge conflicts
      - Auto version bump and publish
      - CI failure-rate report
      - Claude reviewer-hold sweeper
      - Engine pin freshness
      - Format check
      - Gitleaks Secret Scanning
      - Hook lifecycle
      - Lint
      - Main branch health
      - Node tests
      - PR meta (privileged)
      - pre-commit
      - Release canary
      - Weekly Security & Dependency Remediation
      - Sync required status checks
      - Sync from Template
      - Validate config
      - zizmor

concurrency:
  # Keyed per triggering workflow so failures of different workflows never
  # queue behind each other; never cancel — a dropped notification defeats
  # the whole point.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Notify on post-merge CI failure
    # PR-triggered failures are already visible on the PR; only failures of
    # push/schedule runs on the default branch go unnoticed. Skipped/cancelled
    # conclusions are not failures.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run workflows always execute from the default branch, so this
      # fetches exactly the vetted action; sparse + credential-less keeps it
      # to the notifier and nothing else.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/actions/notify-ntfy
          persist-credentials: false

      - name: Notify ntfy
        uses: ./.github/actions/notify-ntfy
        with:
          topic: ${{ secrets.GH_NTFY_SUBJECT }}
          base-url: ${{ secrets.GH_NTFY_URL }}
          title: "${{ github.repository }}: ${{ github.event.workflow_run.name }} failed"
          message: >-
            ${{ github.event.workflow_run.name }} failed on
            ${{ github.event.workflow_run.head_branch }}
            (${{ github.event.workflow_run.event }}, run #${{ github.event.workflow_run.run_number }},
            ${{ github.event.workflow_run.head_sha }}).
          click: ${{ github.event.workflow_run.html_url }}
