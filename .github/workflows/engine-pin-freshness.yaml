name: Engine pin freshness

# Level-triggered guard on the one thing renovate.json5 cannot assert about
# itself: that something is actually bumping the pinned engine. Renovate's rules
# go inert without a sound — an uninstalled App, a rule that stopped matching —
# and the plugin then ships an ever-older engine with no error anywhere. This
# re-asks "is the pin stale?" nightly and fails for as long as the answer is yes,
# so the failure clears itself the moment a bump lands.
#
# Its failure is a schedule failure on the default branch, so `CI failure notify`
# routes it to the usual push (this workflow is named in that workflow's
# `workflows:` list). It changes nothing and opens nothing.
on:
  schedule:
    # After Renovate's own window (renovate.json5 schedules bumps for 00:00-06:00
    # UTC) so a bump opened this morning is not reported as a stale pin.
    - cron: "23 12 * * *"
  workflow_dispatch:

concurrency:
  # Serialize; never cancel — a dropped run is a dropped signal. Static group is
  # safe: schedule/dispatch only, so this never backs a required check.
  group: engine-pin-freshness
  cancel-in-progress: false
  # static-concurrency-ok: not a required check (schedule/dispatch only)

permissions:
  contents: read

jobs:
  freshness:
    name: Pinned engine tracks the newest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup base environment
        uses: ./.github/actions/setup-base-env

      - name: Check the engine pin against npm
        run: bash .github/scripts/check-engine-pin-fresh.sh
