[project]
name = "agent-sanitizer"
version = "0.0.0"
requires-python = ">=3.10"

# detect-secrets + hypothesis back the agent_sanitizer.secrets test suite
# (the folded-in redaction engine). detect-secrets is the engine's only runtime
# dependency (shipped via the wheel's `[secrets]` extra), pulled in here so
# `uv run --extra dev pytest tests/` exercises the engine and its property tests.
[project.optional-dependencies]
# regexploit statically flags super-linear (ReDoS) regexes; the secrets ReDoS
# guard (tests/secrets/test_redos_static_guard.py) shells out to it.
# tomli backfills the stdlib `tomllib` (3.11+) on the 3.10 floor for the test
# suite; marker-gated so 3.11+ uses the stdlib and never installs it.
dev = [
    "pytest>=7",
    # PyYAML parses the workflow YAML the review-findings gate tests assert
    # structural properties of (trigger set, concurrency keys, step order) —
    # properties a text scan cannot read without reimplementing a YAML parser.
    "pyyaml>=6",
    "detect-secrets>=1.5.0",
    "hypothesis>=6",
    "regexploit>=1.0.0",
    "tomli>=2 ; python_version < '3.11'",
    # tree-sitter + its bash grammar answer the one structural question in
    # tests/test_sparse_checkout_source_closure.py — what does this script
    # `source`? A text scan cannot tell a real `source` from one written into a
    # heredoc or a message string, and getting that wrong makes the check fail
    # open on the very omission it exists to catch.
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "drift_guard: SSOT drift-guard contract tests that must never be silently skipped",
]
addopts = "--strict-markers"
