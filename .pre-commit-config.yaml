# Run with: `pre-commit run --all-files` (or install with `pre-commit install`).
# CI runs this via `.github/workflows/pre-commit.yaml` regardless of whether
# contributors have pre-commit installed locally. The existing `.hooks/pre-commit`
# handles staged-file formatting via lint-staged on every commit; this config
# adds wider hygiene checks (shellcheck, large-file detection, JSON/YAML
# validity, etc.) that aren't covered there.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^pnpm-lock\.yaml$
      - id: end-of-file-fixer
        exclude: ^pnpm-lock\.yaml$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
        # Both directories hold sourced libraries reached through a `$HERE`-style
        # variable, which shellcheck cannot resolve on its own: without them on
        # the source path a `# shellcheck source=…` directive resolves to nothing
        # and the sourced file goes unchecked (SC1091).
        args: [-x, -P, ".claude/hooks:.github/scripts"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 2a30809d16bc7a60d9b97353c797f42b510d3368 # v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -w]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 488940d9de1b658fac229e34c521d75a6ea476f2 # v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ci-truth-serum: catch CI "lies" — pipelines that report success while the
  # real work failed, required checks that silently never report, and artifacts
  # pinned to mutable names. No published tag yet, so rev is the main HEAD SHA
  # (pinned per the "SHA-pin third-party sources" rule). ALL hooks enabled:
  # Tier 1 (honesty + identity), Tier 2 (opinionated — this repo follows the
  # decide/reporter + cancel-in-progress conventions they assume; its
  # check-required-reporter forces the `# required-check: true|false` markers
  # sync-required-checks.yaml applies to the branch ruleset), and Extras.
  # Tier aggregates over per-check ids so a check added upstream to a tier
  # applies here with no config change; check-symlinks is the one hook outside
  # any tier, so it stays listed.
  - repo: https://github.com/alexander-turner/ci-truth-serum
    rev: 1314a61e16854aa43da3612989c86533a5667b30 # main
    hooks:
      - id: check-tier1
      - id: check-tier2
      - id: check-extras
      - id: check-symlinks

  - repo: local
    hooks:
      # Offline audits only. zizmor runs its one online audit
      # (`known-vulnerable-actions`, which queries api.github.com/advisories)
      # solely when a token is visible via GH_TOKEN/GITHUB_TOKEN — which is true
      # in agent/CI sessions and false on a normal dev machine, so the audit was
      # never running consistently anywhere. Where it DID fire, an egress policy
      # that blocks the advisories endpoint returns 403 and zizmor treats that as
      # fatal (`fatal: no audit was performed`), making every `.github/` change
      # unpushable from a network-restricted session. Failing closed on an
      # unreachable third-party API is a liveness bug, not a security control.
      # The offline audits — pinned-SHA, template-injection, dangerous-triggers,
      # bot-conditions, artipacked, cache-poisoning — all still run here and in
      # CI. Restore online coverage by giving `.github/workflows/zizmor.yaml` a
      # GH_TOKEN and dropping this flag THERE, not by re-enabling it in a hook
      # that cannot reach the network.
      - id: zizmor
        name: zizmor (GitHub Actions security audit, offline)
        entry: zizmor --no-online-audits
        language: python
        additional_dependencies: ["zizmor==1.25.2"]
        pass_filenames: false
        args: [".github/"]
        files: ^\.github/

      - id: validate-config
        name: validate Claude hook configuration
        entry: bash .github/scripts/validate-config.sh
        language: system
        pass_filenames: false
        files: ^(\.claude/|\.hooks/|\.github/workflows/)

      - id: lint-skills
        name: lint Claude SKILL.md files
        entry: bash .hooks/lint-skills.sh
        language: system
        files: ^\.claude/skills/.*\.md$

      # The four lints below were written to run from here and then never wired
      # up — each one sat in .github/scripts with zero callers, documenting in
      # its own docstring the pre-commit invocation that did not exist. They
      # dogfood clean on the current tree.
      - id: check-hook-timeouts
        name: require an explicit timeout on every PreToolUse hook
        entry: python3 .github/scripts/check-hook-timeouts.py
        language: system
        pass_filenames: false
        files: ^\.claude/settings\.json$

      - id: check-hook-stdin-guarded
        name: require readStdinJson() in a hook's isMain block to sit in a try
        entry: python3 .github/scripts/check-hook-stdin-guarded.py
        language: system
        files: ^\.claude/hooks/.*\.mjs$
        exclude: \.test\.mjs$

      - id: check-test-repo-root
        name: no depth-based repo-root derivation in Python tests
        entry: python3 .github/scripts/check-test-repo-root.py
        language: system
        files: ^tests/.*\.py$

      - id: check-proto-pollution
        name: no plain-object literal used as a dynamic-key map
        entry: node .github/scripts/check-proto-pollution.mjs
        language: system
        pass_filenames: false
        # Scans its own fixed directory set (.claude/hooks, .github/scripts), so
        # the filter only decides WHEN to run, not what gets scanned.
        files: ^(\.claude/hooks/|\.github/scripts/).*\.(mjs|cjs|js|ts)$
