allowBuilds:
  # bun's postinstall links the platform binary out of its optionalDependencies;
  # without it node_modules/.bin/bun is a stub that exits 1.
  bun: true
  esbuild: true

# Supply-chain cooling-off window: refuse to RESOLVE a dependency version
# published less than 3 days ago (4320 minutes). npm account takeovers are
# caught and the malicious version unpublished on a scale of hours to a couple
# of days, so the window converts "installed the compromised version minutes
# after it landed" into "never saw it" — without pinning us to stale deps.
#
# This was already half-configured: `minimumReleaseAgeExclude` below was
# committed WITHOUT this key, and an exclude list with no window to be excluded
# from enforces nothing. tests/test_minimum_release_age.py now fails if the key
# goes missing again.
#
# Cost is near zero: the setting gates RESOLUTION only. `pnpm install
# --frozen-lockfile` — every CI job and the pre-commit path — installs versions
# the lockfile already names and is untouched. It bites `pnpm add` and
# `pnpm update`, which is exactly where a poisoned release would enter.
minimumReleaseAge: 4320

# First-party only: a package published by a repository we control, with npm
# provenance, through a release workflow we can read. The window defends against
# a maintainer account we do not control being taken over; for our own releases
# it buys nothing and only delays adopting a fix we just shipped.
#
# Every entry must name a version package.json pins EXACTLY — an exemption that
# outlives its dependency is a permanent hole in the window, and a bare name
# exempts every future version forever. tests/test_minimum_release_age.py fails
# on either, and on any package outside the first-party set it names.
minimumReleaseAgeExclude:
  - agent-control-plane-core@0.3.0

# Transitive dev dependencies whose direct parent still resolves a version an
# advisory covers. Each entry raises the floor to the advisory's own patched
# version and no further, so the parent keeps choosing the version it wants as
# soon as it ships one. Drop an entry once `pnpm why <name>` shows every path
# already above the floor.
overrides:
  # GHSA-7p8r-x3mc-p8w7 — host confusion via a backslash. Via @commitlint/cli.
  fast-uri@>=3.0.0 <3.1.5: "^3.1.5"
  # GHSA-rgw5-rvv9-x895 — denial of service from unbounded expansion. Via eslint.
  brace-expansion@>=4.0.0 <5.0.9: "^5.0.9"
  # GHSA-5p4m-2wfm-xmqj — quadratic CPU use parsing !!omap. Via @commitlint/cli.
  js-yaml@>=4.0.0 <4.3.1: "^4.3.1"
  # GHSA-q8mj-m7cp-5q26 — remotely triggerable denial of service in qs.stringify.
  # Via @stryker-mutator/core.
  qs@>=6.11.1 <=6.15.1: "^6.15.2"

patchedDependencies:
  micromark-extension-gfm-autolink-literal@2.1.0: patches/micromark-extension-gfm-autolink-literal@2.1.0.patch
